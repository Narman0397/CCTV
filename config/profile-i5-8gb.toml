# =====================================================================
# Profile: Intel Core i5-8250U class (4C/8T, 15 W, UHD 620) + 8 GB RAM
# Maximize FFmpeg VAAPI/QSV + YOLOv8n @ 320. Merge into config.toml
# then: sudo systemctl restart cctv-server
#
# Capacity (CPU YOLO; OpenVINO iGPU is extra if ORT EP is present):
#   2 cameras — AI on both @ 1.0–1.5 FPS (comfortable)
#   4 cameras — AI on all only with input_size=320 + substream + VAAPI
#   6+        — AI on 2 priority cameras
# Point rtsp_url at the camera SUBSTREAM (stream2 / 640×360 / 720p@15).
# =====================================================================

[cameras.defaults]
default_fps = 15
default_preview_fps = 4

[recording]
segment_seconds = 300
enabled_by_default = true
hardware_encode = false

[ai]
enabled_by_default = true
model_file = "yolov8n.onnx"
default_max_fps = 1.5
idle_fps = 0.3
motion_fps = 1.0
active_fps = 1.5
input_size = 320
conf_threshold = 0.35
iou_threshold = 0.45
max_inference_latency_ms = 200
cpu_high_load_percent = 65
cpu_critical_load_percent = 80
ram_high_pressure_percent = 75
queue_capacity = 2
engine = "onnx"

[motion]
enabled_by_default = true
frame_width = 160
frame_height = 90
threshold = 12
sensitivity = 1.0
debounce_seconds = 2

[hardware]
acceleration = "auto"
enable_vaapi = true
enable_qsv = true
